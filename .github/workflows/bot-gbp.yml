name: BOT V7.4 GBP - Frankfurt VPS

on:
  push:
    branches: [ Principal ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  bot-gbp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Config Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar deps
        run: pip install requests
      - name: Ejecutar BOT TODO EN GBP - DANNY
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET: ${{ secrets.BINANCE_SECRET }}
        run: |
          echo "=== BOT V7.4 - 1000 GBP DEMO - DANNY - Frankfurt ==="
          python BOT_GBP_V74.py
          python ver_saldo_gbp.py
